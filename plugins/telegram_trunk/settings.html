<div class="space-y-6">
    <div class="bg-surface rounded-2xl p-6 border border-outline/30 shadow-sm">
        <div class="flex items-center gap-3 pb-4 border-b border-surface-container">
            <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center font-bold">
                <span class="material-symbols-outlined text-3xl">telegram</span>
            </div>
            <div>
                <h3 class="text-base font-bold text-on-surface tg-translate">Настройки Telegram Trunk (Telethon)</h3>
                <p class="text-xs text-on-surface-variant tg-translate">Авторизация аккаунта для приема звонков и отправки сообщений.</p>
            </div>
        </div>

        <div class="mt-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Phone & Auth -->
                <div class="space-y-4">
                    <h4 class="text-sm font-bold text-primary tg-translate">1. Авторизация</h4>
                    
                    <div id="tg-phone-step">
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 tg-translate">Номер телефона (с кодом страны)</label>
                        <div class="flex gap-2">
                            <input type="text" id="tg_phone" placeholder="+79991234567" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-outline/40 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                            <button type="button" onclick="sendTgCode()" class="px-4 py-2 bg-primary text-on-primary rounded-xl font-bold text-xs hover:bg-primary/90 transition-colors whitespace-nowrap tg-translate">Отправить код</button>
                        </div>
                    </div>

                    <div id="tg-code-step" class="hidden space-y-4 p-4 rounded-xl bg-surface-container border border-outline/30">
                        <div>
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 tg-translate">Код из Telegram</label>
                            <input type="text" id="tg_code" placeholder="12345" class="w-full px-4 py-2.5 rounded-xl bg-surface border border-outline/40 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                        </div>
                        <div id="tg-2fa-block" class="hidden">
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 tg-translate">Облачный пароль (2FA)</label>
                            <input type="password" id="tg_password" placeholder="Пароль" class="w-full px-4 py-2.5 rounded-xl bg-surface border border-outline/40 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                        </div>
                        <button type="button" onclick="loginTg()" class="w-full py-2.5 bg-success text-on-primary rounded-xl font-bold text-xs hover:bg-success/90 transition-colors tg-translate">Войти в аккаунт</button>
                    </div>

                    <div id="tg-status-alert" class="hidden p-3 rounded-xl text-xs font-bold mt-2"></div>
                </div>

                <!-- Profile & SIP -->
                <div class="space-y-4">
                    <h4 class="text-sm font-bold text-primary tg-translate">2. Профиль и Маршрутизация</h4>
                    
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 tg-translate">Имя профиля (First Name)</label>
                        <input type="text" id="tg_first_name" placeholder="Asterisk PBX" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-outline/40 text-sm text-on-surface">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 tg-translate">Локальный SIP-порт для WebRTC моста</label>
                        <input type="number" id="tg_sip_port" value="5062" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-outline/40 text-sm text-on-surface">
                        <p class="text-[10px] text-on-surface-variant mt-1 tg-translate">Через этот порт tg2sip будет связываться с ядром Asterisk.</p>
                    </div>
                </div>
            </div>
            
            <div class="pt-4 border-t border-surface-container flex justify-end gap-3">
                <button type="button" class="px-5 py-2.5 rounded-xl font-bold text-xs border border-outline text-on-surface hover:bg-surface-container transition-all tg-translate">Отмена</button>
                <button type="button" onclick="saveTgSettings()" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-primary text-on-primary hover:shadow-lg hover:shadow-primary/30 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">save</span>
                    <span class="tg-translate">Сохранить настройки</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Mock functions for UI behavior
function sendTgCode() {
    const phone = document.getElementById('tg_phone').value;
    if(!phone) return alert('Введите номер телефона');
    
    document.getElementById('tg-status-alert').className = 'p-3 rounded-xl text-xs font-bold mt-2 bg-primary/10 text-primary';
    document.getElementById('tg-status-alert').innerText = 'Отправка кода (Telethon)...';
    
    setTimeout(() => {
        document.getElementById('tg-status-alert').innerText = 'Код отправлен в Telegram!';
        document.getElementById('tg-code-step').classList.remove('hidden');
    }, 1000);
}

function loginTg() {
    const code = document.getElementById('tg_code').value;
    if(!code) return alert('Введите код');
    
    document.getElementById('tg-status-alert').className = 'p-3 rounded-xl text-xs font-bold mt-2 bg-warning/10 text-warning';
    document.getElementById('tg-status-alert').innerText = 'Авторизация в Telegram (MTProto)...';
    
    setTimeout(() => {
        document.getElementById('tg-status-alert').className = 'p-3 rounded-xl text-xs font-bold mt-2 bg-success/10 text-success';
        document.getElementById('tg-status-alert').innerText = 'Успешная авторизация! Аккаунт готов к звонкам.';
    }, 1500);
}

function saveTgSettings() {
    alert('Настройки Telegram Trunk сохранены. Мост tg2sip перезапущен.');
}
</script>
