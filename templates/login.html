<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Вход в систему — Asterisk Logic Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    "surface": "#ffffff",
                    "background": "#f8f9fa",
                    "on-surface": "#191c1d",
                    "on-surface-variant": "#414754",
                    "primary": "#005bbf",
                    "outline": "#dadce0",
                    "error": "#d93025"
                }
            }
        }
    }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 font-sans text-on-surface">
    <div class="max-w-md w-full bg-surface rounded-3xl p-8 border border-outline/40 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-primary/10 text-primary mx-auto flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-3xl">lock</span>
            </div>
            <h1 class="text-2xl font-bold text-on-surface tracking-tight">Asterisk Logic Core</h1>
            <p class="text-xs text-on-surface-variant">Введите учетные данные администратора для входа в панель управления</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="p-3 rounded-xl bg-error/10 border border-error/20 text-error text-xs font-semibold text-center">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Логин</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
                    <input type="text" name="username" placeholder="admin" required class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-background border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">Пароль</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">key</span>
                    <input type="password" name="password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-background border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none text-sm">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary/90 transition-all shadow-sm">
                Войти в систему
            </button>
        </form>

        <div class="pt-4 border-t border-outline/30 text-center text-xs text-on-surface-variant font-mono">
            Protected by Logic Core Security Guard
        </div>
    </div>
</body>
</html>
